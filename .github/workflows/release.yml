# Publication : à chaque nouvelle version sur main (## Version de WarbandKeeper.toc), crée la Release
# vX.Y.Z avec le zip de l'addon (git archive, comme dist/) et les notes de CHANGELOG.md, puis y joint le
# client PC (client/wk_client.py construit en .exe par PyInstaller sur Windows). Le client
# (WarbandKeeper-Client.exe) lit ces Releases pour installer et mettre à jour l'addon et lui-même.
# Un changement du client sans nouvelle version de l'addon remplace l'exe de la dernière Release.
# Notes : celles de l'addon (CHANGELOG.md) d'abord, puis « ## Client PC x.y.z » (client/CHANGELOG.md) quand
# le client change ; client/CHANGELOG.md est aussi joint (WarbandKeeper-Client-notes.md).
name: Publication

on:
  push:
    branches: [main]
    paths: ["WarbandKeeper.toc", "client/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  addon:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: v
        run: |
          echo "version=$(sed -n 's/^## Version: *//p' WarbandKeeper.toc | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: Release de l'addon
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "La release v$V existe déjà."
            exit 0
          fi
          git archive --prefix=WarbandKeeper/ -o "WarbandKeeper-$V.zip" HEAD
          awk -v v="## v$V " 'index($0, v) == 1 {on = 1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Version $V" > notes.md
          # filet de sécurité : nouveaux fichiers de l'addon (ou .toc modifié) depuis la release précédente
          # = redémarrage complet du jeu, même si les notes disent qu'un /reload suffit
          PREV=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then
            NEW=$(git diff --name-only --diff-filter=A "$PREV" HEAD -- '*.lua' '*.xml' '*.tga' '*.blp' '*.ttf' '*.ogg' | grep -v -E '^(client|tools|\.github)/' || true)
            TOC=$(git diff "$PREV" HEAD -- WarbandKeeper.toc | grep -E '^[-+][^-+]' | grep -v '## Version' || true)
            if [ -n "$NEW$TOC" ] && grep -q 'reload suffit' notes.md; then
              echo "Nouveaux fichiers depuis $PREV : $NEW"
              sed -i 's#^_Un /reload suffit\._$#_Redémarrage complet du jeu nécessaire (nouveaux fichiers)._#' notes.md
            fi
          fi
          gh release create "v$V" "WarbandKeeper-$V.zip" --title "Warband Keeper $V" --notes-file notes.md --target "$GITHUB_SHA"

  client:
    needs: addon
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Construction du client
        shell: bash
        run: |
          CV=$(sed -n 's/^CLIENT_VERSION = "\(.*\)"/\1/p' client/wk_client.py)
          echo "CV=$CV" >> "$GITHUB_ENV"
          pip install pyinstaller
          pyinstaller --noconfirm --onefile --windowed --name "WarbandKeeper-Client-$CV" \
            --icon client/assets/logo.ico --add-data "client/assets;assets" --add-data "client/CHANGELOG.md;." client/wk_client.py

      - name: Joindre à la release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.addon.outputs.version }}
        run: |
          # anciennes versions du client retirées de cette release, la nouvelle jointe
          for a in $(gh release view "v$V" --json assets --jq '.assets[].name' | grep '^WarbandKeeper-Client-' || true); do
            [ "$a" = "WarbandKeeper-Client-$CV.exe" ] || gh release delete-asset "v$V" "$a" -y
          done
          gh release upload "v$V" "dist/WarbandKeeper-Client-$CV.exe" --clobber
          # notes du client (lues par le client : Nouveautés > Client)
          cp client/CHANGELOG.md WarbandKeeper-Client-notes.md
          gh release upload "v$V" WarbandKeeper-Client-notes.md --clobber
          # nouvelle version du client : sa section ajoutée aux notes de la release, après celles de l'addon
          BODY=$(gh release view "v$V" --json body --jq .body)
          if ! printf '%s' "$BODY" | grep -q "^## Client PC $CV"; then
            awk -v v="## $CV " 'index($0, v) == 1 {on = 1; next} on && /^## / {exit} on {print}' client/CHANGELOG.md > client-notes.md
            if [ -s client-notes.md ]; then
              { printf '%s\n\n## Client PC %s\n' "$BODY" "$CV"; cat client-notes.md; } > body.md
              gh release edit "v$V" --notes-file body.md
            fi
          fi
